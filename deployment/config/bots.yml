# Aurora Chess - bot roster
#
# Characters are ordered by altitude, not just rating: the ladder climbs from
# a village that barely looks up, through weather, into the aurora itself, and
# out to deep sky. Voice shifts with the band - Hearthside characters talk TO
# you, Weather talks AT you, Deep sky barely acknowledges you exist.
#
# Bands: Hearthside (200-800), Trailhead (900-1200), Weather (1300-1900),
#        Aurora (2000-2500), Deep sky (2600-3200)
#
# Tiers control the ENGINE, bands control the WRITING. They are independent.
#   custom (200-1200)   - JS minimax with personality quirks
#   hybrid (1300-1900)  - Stockfish at limited depth with blunder injection
#   engine (2000+)      - Stockfish with UCI_Elo limiting
#
# avatar is a path under apps/web/public. The UI falls back to initials when
# the file is absent, so art can land one character at a time.
#
# Run `make seed-bots` to apply. FORCE_RESEED=1 to overwrite admin edits.

bots:
- id: pip
  name: Pip
  elo: 200
  description: Learned the rules last week. Still checks which way pawns go.
  avatar: /bots/pip.png
  tier: custom
  category: beginner
  randomMoveChance: 0.45
  blunderChance: 0.3
  captureGreed: 0.2
  aggressionBias: 0
  maxDepth: 1
  queenEarly: false
  pawnPusher: true
  band: Hearthside
  messages:
    gameStart:
    - Oh good, someone to play with.
    - Right then. Best of luck to us both.
    onCapture:
    - Sorry — was that one important?
    - I'll take that, thank you.
    onBeingChecked:
    - Oh dear.
    - Right, right, hold on.
    onGivingCheck:
    - Is that check? I think that's check.
    - Mind your king.
    onBlunder:
    - Ah. I've done something silly.
    - That was not the plan.
    onPlayerBlunder:
    - Are you sure about that one?
    - Oh — well, thank you.
    onWinning:
    - I don't want to jinx it.
    - This is going better than usual.
    onLosing:
    - You're much better than me.
    - Well, I'm learning something.
    onCheckmate:
    - I won! I actually won!
    - Don't tell anyone I got lucky.
    onCheckmated:
    - Lovely game. Really.
    - You've given me something to think about.
    onDraw:
    - Honours even. I'll take it.
    - A draw suits me fine.
