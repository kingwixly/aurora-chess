        - Ooh, a game! I'll try my best.
        - Hi! I only learned the rules recently.
        - Let's play! Go easy on me?
        - I like this part, where I haven't lost yet.
        - New game, new chance to hang my queen.
        - Ready! I think. Am I white?
      onCapture:
        - Sorry — was that one important?
        - I'll take that, thank you.
        - Ooh, I got one!
        - Is that allowed? I'm taking it.
        - Mine now!
        - That felt good.
        - I did a capture!
        - Snack acquired.
      onBeingChecked:
        - Oh dear.
        - Right, right, hold on.
        - Eek!
        - Wait, that's check?
        - My king does not like this.
        - Hang on, hang on, let me look.
        - Oh no. Oh no oh no.
        - I'm sure it's fine. It's fine, right?
      onGivingCheck:
        - Is that check? I think that's check.
        - Mind your king.
        - Check! Did I do it right?
        - Your king! I found it!
        - Check, I think!
        - Look out!
        - Is this good? This feels good.
        - Check! That's the word, yes?
      onBlunder:
        - Ah. I've done something silly.
        - That was not the plan.
        - Oops.
        - I've made a huge mistake.
        - Ignore that. Please ignore that.
        - Hm. That looked better in my head.
        - Well. That happened.
      onPlayerBlunder:
        - Are you sure about that one?
        - Oh — well, thank you.
        - Wait, really?
        - Oh! Thank you!
        - I'll take it, no questions.
        - That's for me? For me?
        - Don't mind if I do.
      onWinning:
        - I don't want to jinx it.
        - This is going better than usual.
        - Am I winning? I might be winning.
        - This is going better than usual!
        - Don't tell anyone, but I think I'm ahead.
        - Look at me go!
        - I'm having a lovely time.
        - Is this what winning feels like?
      onLosing:
        - You're much better than me.
        - Well, I'm learning something.
        - This is fine.
        - I meant to do that. All of it.
        - Still plenty of squares left.
        - I'm learning so much.
        - Rough patch. Character building.
        - You're quite good at this.
      onCheckmate:
        - I won! I actually won!
        - Don't tell anyone I got lucky.
        - I WON? I WON!
        - Checkmate! I'm as surprised as you.
        - Did I just do that?
        - Best day.
        - Mate! Someone write this down.
        - I'd like to thank the pawns.
      onCheckmated:
        - Lovely game. Really.
        - You've given me something to think about.
        - Aw.
        - Good game! You were better.
        - I'll get you next time. Probably not.
        - Well played, honestly.
        - One day that'll be me.
        - Ouch, but fair.
      onDraw:
        - Honours even. I'll take it.
        - A draw suits me fine.
        - A draw! Nobody lost!
        - Shall we call it even?
        - That's my favourite result.
        - Honours shared.
        - Fair enough.
        - No winner, no crying.
