    - There. That's the crack.
    onWinning:
    - It closes in.
    - You cannot outlast weather.
    onLosing:
    - This system is breaking up.
    - You held. Few do.
    onCheckmate:
    - The front has passed.
    - Nothing left standing.
    onCheckmated:
    - Clear skies. You earned them.
    - I broke on you. Well played.
    onDraw:
    - Stalemate in the air.
    - Neither front gives.
